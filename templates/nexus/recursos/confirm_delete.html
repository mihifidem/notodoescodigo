{% extends "base.html" %}
{% block page_title %}Eliminar recurso{% endblock %}
{% block content %}
<div class="p-4" style="max-width:480px;">
  <div class="card border-danger" style="border-radius:12px;">
    <div class="card-body p-4 text-center">
      <i class="bi bi-trash3 text-danger fs-1 mb-3 d-block"></i>
      <h5 class="fw-bold mb-1">¿Eliminar este recurso?</h5>
      <p class="text-muted mb-1">{{ object.titulo }}</p>
      <p class="text-muted small mb-4">{{ object.test.nombre }}</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
          <button type="submit" class="btn btn-danger px-4" style="border-radius:8px;">
            <i class="bi bi-trash me-1"></i>Sí, eliminar
          </button>
          <a href="{% url 'nexus:test_info' object.test.pk %}" class="btn btn-outline-secondary" style="border-radius:8px;">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
