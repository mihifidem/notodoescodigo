{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --nx-primary: #1B3C59;
    --nx-secondary: #00C4FF;
    --nx-success: #22C55E;
    --nx-warning: #F59E0B;
    --nx-danger: #EF4444;
    --nx-bg: #F8FAFC;
    --nx-surface: #FFFFFF;
    --nx-border: #E5E7EB;
    --nx-text: #1F2937;
  }
  .nexus-heading { font-family: 'Poppins', sans-serif; }
  body { font-family: 'Inter', sans-serif; }

  .nx-hero {
    background: linear-gradient(135deg, var(--nx-primary) 0%, #0f2540 100%);
    color: #fff;
    border-radius: 16px;
    padding: 2rem 2.5rem;
    position: relative;
    overflow: hidden;
  }
  .nx-hero::after {
    content: '⬡';
    font-size: 14rem;
    position: absolute;
    right: -2rem;
    top: -3rem;
    opacity: .05;
    line-height: 1;
  }
  .nx-stat-card {
    border: 0;
    border-radius: 12px;
    transition: transform .2s, box-shadow .2s;
    overflow: hidden;
  }
  .nx-stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
  .nx-stat-icon {
    width: 56px; height: 56px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
  }
  .nx-module-card {
    border: 0;
    border-radius: 12px;
    border-left: 4px solid;
    transition: transform .15s, box-shadow .15s;
  }
  .nx-module-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .nx-layer-badge {
    font-size: .7rem;
    font-weight: 600;
    padding: .25rem .6rem;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .nx-score-ring {
    width: 120px; height: 120px;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .nx-score-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
  .nx-score-ring .score-num {
    font-family: 'Poppins', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--nx-primary);
    z-index: 1;
  }
  .nx-progress-bar { height: 8px; border-radius: 4px; overflow: hidden; }
  .nx-nav-pill {
    background: rgba(27,60,89,.06);
    border-radius: 10px;
    padding: .5rem;
    gap: .25rem;
  }
  .nx-nav-pill .nav-link {
    border-radius: 8px;
    font-weight: 500;
    font-size: .88rem;
    color: var(--nx-text);
    padding: .45rem 1rem;
  }
  .nx-nav-pill .nav-link.active, .nx-nav-pill .nav-link:hover {
    background: var(--nx-primary);
    color: #fff;
  }
  .nx-table thead th {
    background: var(--nx-primary);
    color: #fff;
    font-weight: 600;
    font-size: .82rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    border: 0;
  }
  .nx-table tbody tr:hover { background: rgba(27,60,89,.03); }
  .nx-btn-primary {
    background: linear-gradient(135deg, var(--nx-primary), #234d72);
    border: 0;
    color: #fff;
    font-weight: 600;
    border-radius: 8px;
    padding: .5rem 1.25rem;
    transition: opacity .2s, transform .1s;
  }
  .nx-btn-primary:hover { opacity: .9; color: #fff; transform: translateY(-1px); }
  .nx-btn-cyan {
    background: linear-gradient(135deg, #0090cc, var(--nx-secondary));
    border: 0;
    color: #fff;
    font-weight: 600;
    border-radius: 8px;
    padding: .5rem 1.25rem;
    transition: opacity .2s;
  }
  .nx-btn-cyan:hover { opacity: .9; color: #fff; }
  .nx-card {
    border: 1px solid var(--nx-border);
    border-radius: 12px;
    background: var(--nx-surface);
  }
  .nx-section-title {
    font-family: 'Poppins', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--nx-primary);
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .nx-section-title::before {
    content: '';
    display: inline-block;
    width: 4px; height: 20px;
    background: var(--nx-secondary);
    border-radius: 2px;
  }
  /* Sub-nav for nexus sections */
  .nx-subnav {
    background: var(--nx-primary);
    padding: .5rem 1.5rem;
    border-radius: 0;
    gap: .5rem;
  }
  .nx-subnav .nav-link {
    color: rgba(255,255,255,.7);
    font-weight: 500;
    font-size: .85rem;
    padding: .4rem .9rem;
    border-radius: 6px;
    transition: background .15s, color .15s;
  }
  .nx-subnav .nav-link:hover, .nx-subnav .nav-link.active {
    background: rgba(255,255,255,.15);
    color: #fff;
  }
  .nx-subnav .nav-link i { margin-right: .35rem; }
  [data-bs-theme="dark"] .nx-card { background: #1e293b; border-color: #334155; }
  [data-bs-theme="dark"] .nx-stat-card { background: #1e293b; }
  [data-bs-theme="dark"] .nx-section-title { color: #60A5FA; }
  [data-bs-theme="dark"] .nx-table thead th { background: #0f2540; }
</style>
{% endblock %}

{% block content %}
<!-- Nexus Sub-navigation -->
<nav class="nx-subnav d-flex flex-wrap align-items-center mb-0">
  <span class="nexus-heading text-white fw-bold me-4" style="font-size:.95rem;">
    <i class="bi bi-dna me-1" style="color:#00C4FF;"></i>Nexus 2026
  </span>
  <ul class="nav">
    <li class="nav-item">
      <a href="{% url 'nexus:dashboard' %}"
         class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <i class="bi bi-grid-3x3-gap"></i>Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a href="{% url 'nexus:test_list' %}"
         class="nav-link {% if 'test' in request.resolver_match.url_name %}active{% endif %}">
        <i class="bi bi-file-earmark-code"></i>Tests HTML
      </a>
    </li>
    <li class="nav-item">
      <a href="{% url 'nexus:module_list' %}"
         class="nav-link {% if 'module' in request.resolver_match.url_name or 'question' in request.resolver_match.url_name %}active{% endif %}">
        <i class="bi bi-boxes"></i>Módulos
      </a>
    </li>
    <li class="nav-item">
      <a href="{% url 'nexus:profile_list' %}"
         class="nav-link {% if 'profile' in request.resolver_match.url_name %}active{% endif %}">
        <i class="bi bi-person-badge"></i>Perfiles DNA
      </a>
    </li>
  </ul>
</nav>

<div class="p-4">
  {% block nexus_content %}{% endblock %}
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block nexus_js %}{% endblock %}
{% endblock %}
