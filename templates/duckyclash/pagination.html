{% if page_obj.has_other_pages %}
<nav aria-label="Páginas" class="d-flex flex-wrap gap-3 mt-4">
    {% if page_obj.has_previous %}<a href="?{{ filters }}&amp;page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
    <span aria-current="page">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?{{ filters }}&amp;page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}
</nav>
{% endif %}
