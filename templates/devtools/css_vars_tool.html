{% extends 'base.html' %}

{% block title %}CSS variables{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="card shadow border-0 rounded-4">
        <div class="card-header bg-primary text-white py-3 px-4">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <h2 class="h4 mb-0">CSS variables</h2>
            <a href="{% url 'devtools:hub' %}" class="btn btn-light btn-sm rounded-pill">
              <i class="bi bi-arrow-left me-1"></i>Volver al menú
            </a>
          </div>
        </div>
        <div class="card-body p-4">
          <form method="get" class="row g-3">
            <div class="col-md-3"><label class="form-label">Primary</label><input type="text" name="base" value="{{ base }}" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Accent</label><input type="text" name="accent" value="{{ accent }}" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Radius</label><input type="number" name="radius" value="{{ radius }}" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Spacing</label><input type="number" name="spacing" value="{{ spacing }}" class="form-control"></div>
            <div class="col-12"><button type="submit" class="btn btn-primary rounded-pill">Generar</button></div>
          </form>
          <pre class="mt-4 mb-0 p-3 bg-dark text-light rounded-4"><code>{{ snippet }}</code></pre>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
