{% extends 'base.html' %}

{% block title %}Breakpoints{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="card shadow border-0 rounded-4">
        <div class="card-header bg-info text-dark py-3 px-4">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <h2 class="h4 mb-0">Breakpoints</h2>
            <a href="{% url 'devtools:hub' %}" class="btn btn-dark btn-sm rounded-pill">
              <i class="bi bi-arrow-left me-1"></i>Volver al menú
            </a>
          </div>
        </div>
        <div class="card-body p-4">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
              <div class="small text-uppercase text-primary fw-bold mb-2">Cómo usarlo</div>
              <p class="mb-0 text-secondary">
                Esta miniapp te ayuda a preparar breakpoints y media queries para diseño responsive de forma rápida.
              </p>
            </div>
            <button type="button" class="btn btn-outline-primary rounded-pill" data-bs-toggle="modal" data-bs-target="#toolInstructionsModal">
              <i class="bi bi-info-circle me-1"></i>Ver instrucciones
            </button>
          </div>

          <form method="get" class="row g-3">
            <div class="col-md-3"><label class="form-label">sm</label><input type="number" name="sm" value="{{ sm }}" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">md</label><input type="number" name="md" value="{{ md }}" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">lg</label><input type="number" name="lg" value="{{ lg }}" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">xl</label><input type="number" name="xl" value="{{ xl }}" class="form-control"></div>
            <div class="col-12"><button type="submit" class="btn btn-info rounded-pill">Generar</button></div>
          </form>
          <pre class="mt-4 mb-0 p-3 bg-dark text-light rounded-4"><code>{{ snippet }}</code></pre>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
