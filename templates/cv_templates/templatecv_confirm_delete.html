{% extends 'base.html' %}
{% block content %}
<h2>Eliminar Template de CV</h2>
<p>¿Estás seguro de eliminar el template "{{ template.nombre }}"?</p>
<form method="post">{% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'cv_templates:list' %}">Cancelar</a>
</form>
{% endblock %}
