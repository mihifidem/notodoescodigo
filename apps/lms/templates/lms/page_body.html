{% load i18n %}
{% if page.has_own_styles %}
  <iframe title="{{ page.title }}" sandbox="" referrerpolicy="no-referrer" srcdoc="{{ page.content }}" style="display:block;width:100%;height:75vh;min-height:400px;border:0;background:white;" aria-label="{% trans 'Contenido HTML con estilos propios' %}"></iframe>
{% else %}
  {{ page.content|safe }}
{% endif %}
